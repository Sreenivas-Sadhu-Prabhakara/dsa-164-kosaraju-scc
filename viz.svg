<text x="56.0" y="334.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Pass 1: DFS, record finish order. Pass 2: REVERSE every edge and DFS in reverse</text>
<text x="56.0" y="353.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">finish order — inside an SCC the cycle survives reversal, but the exits turn into</text>
<text x="56.0" y="372.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">entrances, so each DFS is trapped exactly within one SCC.</text>
